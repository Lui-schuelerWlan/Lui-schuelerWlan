name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# WICHTIG: Erlaubt dem Bot, die Textdatei ins Repo zu pushen
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Ping Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/klicks?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          
      - name: Update Timestamp & Commit (Keepalive)
        run: |
          # 1. Schreibe das aktuelle Datum in eine Log-Datei
          date > last_ping.txt
          
          # 2. Konfiguriere Git für den GitHub Actions Bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 3. Füge die Änderung hinzu
          git add last_ping.txt
          
          # 4. Erstelle einen Commit (nur wenn sich etwas geändert hat)
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update ping timestamp to keep repo active"
          
          # 5. Pushe die Änderung in dein Repository
          git push
